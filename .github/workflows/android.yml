name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Force Remove Termux AAPT2
      run: |
        find . -type f \( -name "*.properties" -o -name "*.gradle*" -o -name "*.kts" \) -exec sed -i '/aapt2/Id' {} +
        echo "android.aapt2FromMavenOverride=" >> gradle.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AppForge-APK
        path: app/build/outputs/apk/debug/*.apk
